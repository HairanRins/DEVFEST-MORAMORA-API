openapi: 3.0.3
info:
  title: MoraMora API
  version: 1.0.0
  description: |2

    API **MoraMora** : authentification JWT (REST) et détection d'infractions
    YOLOv8, par upload REST (`POST /api/detection/image/` et
    `POST /api/detection/video/`, testables ici) ou en temps réel via WebSocket
    (`/ws/detection/`, non testable dans Swagger : voir ci-dessous).

    Les deux sont reliés : un WebSocket ouvert reçoit aussi les alertes des photos
    et vidéos uploadées en REST par le même utilisateur.

    ## Authentification

    1. `POST /api/auth/signup/` pour créer un compte.
    2. `POST /api/auth/login/` renvoie `data.access` (JWT HS256 **sans expiration**).
    3. Envoyer `Authorization: Bearer <JWT>` sur les routes protégées
       (bouton **Authorize** ci-dessus : coller uniquement le token).
    4. `POST /api/auth/logout/` révoque immédiatement le token.

    Les erreurs suivent toujours le format
    `{"success": false, "message": "...", "errors": {...}}`.

    ## WebSocket de détection — `/ws/detection/`

    URL : `wss://<hôte>/ws/detection/` (`ws://localhost:8000/ws/detection/` en local).

    **Connexion**

    - Navigateur : `new WebSocket(url, ["bearer", accessToken])` — le serveur
      sélectionne le sous-protocole `bearer`.
    - Autre client : en-tête `Authorization: Bearer <JWT>`.
    - Un en-tête `Origin` présent dans `WEBSOCKET_ALLOWED_ORIGINS` est obligatoire.
    - Le JWT dans l'URL (query string) est refusé.

    | Code de fermeture | Cause |
    | --- | --- |
    | `4401` | JWT absent, invalide, révoqué ou compte inactif |
    | `4403` | En-tête `Origin` absent |
    | `403` (handshake refusé) | Origine non autorisée |

    **Client → serveur** (une image par message)

    - trame binaire contenant un JPEG ou PNG brut ;
    - ou JSON `WsImageMessage` : `{"type": "image", "image": "<base64 ou data URL>"}`.

    Limites : 5 Mio et 20 mégapixels par image (configurables).

    **Serveur → client**

    - `WsDetectionResult` : image annotée (JPEG base64) + détections ;
    - `WsAlert` : envoyé juste après le résultat si au moins une détection.
      Aussi envoyé pour les uploads REST de l'utilisateur : `source` vaut alors
      `image_upload` ou `video_upload` (avec `frame` et `timestamp`) et `upload_id`
      correspond à la réponse HTTP ;
    - `WsVideoCompleted` : fin d'analyse d'une vidéo uploadée (résumé) ;
    - `WsError` : `code` = `invalid_image` | `busy` | `processing_error`.
      `busy` signifie qu'une inférence est déjà en cours : réessayer.

    Les schémas de ces messages sont listés dans la section **Schemas** en bas de page.

    ```javascript
    const socket = new WebSocket("wss://<hôte>/ws/detection/", ["bearer", accessToken]);
    socket.onopen = () => socket.send(JSON.stringify({ type: "image", image: dataUrl }));
    socket.onmessage = ({ data }) => {
      const msg = JSON.parse(data);
      if (msg.type === "detection_result") show(msg.data.image, msg.data.detections);
      if (msg.type === "alert") notify(msg.data.detections); // live ou upload REST
      if (msg.type === "video_completed") done(msg.upload_id, msg.data.summary);
      if (msg.type === "error") console.warn(msg.code, msg.message);
    };
    ```
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: 'Renvoie `data.access`, à envoyer ensuite dans `Authorization:
        Bearer <JWT>` (REST) ou comme sous-protocole WebSocket.'
      summary: Se connecter et obtenir un JWT
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              Connexion:
                value:
                  email: john@example.com
                  password: A-strong-password-123!
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Données invalides.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Identifiants invalides ou compte inactif.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Trop de tentatives (LOGIN_RATE_LIMIT).
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Se déconnecter (révoque le JWT courant)
      tags:
      - Authentification
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: JWT absent, invalide ou révoqué.
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      summary: Profil de l'utilisateur connecté
      tags:
      - Authentification
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: JWT absent, invalide ou révoqué.
  /api/auth/signup/:
    post:
      operationId: auth_signup_create
      description: Email et username uniques (insensibles à la casse). Le mot de passe
        doit respecter les validateurs Django.
      summary: Créer un compte
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            examples:
              Inscription:
                value:
                  username: john
                  email: john@example.com
                  password: A-strong-password-123!
                  password_confirmation: A-strong-password-123!
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Données invalides.
  /api/detection/image/:
    post:
      operationId: detection_image_create
      description: 'Envoie une photo (multipart, champ `image`) et renvoie l''image
        annotée + les détections YOLOv8. Si une infraction est détectée, un message
        `alert` (`source: "image_upload"`) est aussi envoyé aux WebSockets `/ws/detection/`
        ouverts par le même utilisateur.'
      summary: Analyser une photo
      tags:
      - Détection
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageUploadRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDetectionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionErrorResponse'
          description: Image absente ou invalide.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: JWT absent, invalide ou révoqué.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionErrorResponse'
          description: 'Moteur occupé (`busy`) : réessayer.'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionErrorResponse'
          description: Erreur pendant l'inférence.
  /api/detection/video/:
    post:
      operationId: detection_video_create
      description: |-
        Envoie une vidéo (multipart, champ `video`). Le serveur analyse `sample_fps` images par seconde (120 images max) et renvoie, pour chaque image contenant une infraction, son horodatage, ses détections et l'image annotée.

        **Temps réel via WebSocket** : pendant le traitement, chaque infraction est envoyée aux WebSockets `/ws/detection/` de l'utilisateur (`alert`, `source: "video_upload"`, avec `frame` et `timestamp`), puis un message `video_completed` signale la fin. Le traitement est synchrone : la requête HTTP dure le temps de l'analyse.
      summary: Analyser une vidéo
      tags:
      - Détection
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VideoUploadRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoDetectionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionErrorResponse'
          description: Vidéo absente ou invalide.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: JWT absent, invalide ou révoqué.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionErrorResponse'
          description: 'Moteur occupé (`busy`) : réessayer.'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionErrorResponse'
          description: Erreur pendant l'inférence.
  /api/health/:
    get:
      operationId: health_retrieve
      description: Liveness probe used by Render; does not touch the database.
      summary: État du service
      tags:
      - Système
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
components:
  schemas:
    DetectionErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          default: false
        code:
          $ref: '#/components/schemas/DetectionErrorResponseCodeEnum'
        message:
          type: string
      required:
      - code
      - message
    DetectionErrorResponseCodeEnum:
      enum:
      - invalid_image
      - invalid_video
      - busy
      - processing_error
      type: string
      description: |-
        * `invalid_image` - invalid_image
        * `invalid_video` - invalid_video
        * `busy` - busy
        * `processing_error` - processing_error
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          default: false
        message:
          type: string
        errors:
          type: object
          additionalProperties: {}
          description: 'Erreurs de validation par champ (ex. {"email": ["..."]}).'
      required:
      - message
    EventEnum:
      type: string
      enum:
      - DETECTION_ALERT
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          default: ok
    ImageDetectionData:
      type: object
      properties:
        detections:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: Détections (format du schéma WsDetection).
        upload_id:
          type: string
          format: uuid
          description: Identifiant repris dans les messages WebSocket.
        image:
          type: string
          description: Image annotée, JPEG encodé en base64.
        alert:
          type: boolean
          description: true si au moins une infraction est détectée.
      required:
      - alert
      - detections
      - image
      - upload_id
    ImageDetectionResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        message:
          type: string
          default: Image processed successfully
        data:
          $ref: '#/components/schemas/ImageDetectionData'
      required:
      - data
    ImageUploadRequest:
      type: object
      properties:
        image:
          type: string
          format: binary
          description: Photo JPEG ou PNG (5 Mio max).
      required:
      - image
    LoginData:
      type: object
      properties:
        access:
          type: string
          description: JWT d'accès (Bearer).
        user:
          $ref: '#/components/schemas/UserSummary'
      required:
      - access
      - user
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        message:
          type: string
          default: Login successful
        data:
          $ref: '#/components/schemas/LoginData'
      required:
      - data
    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        message:
          type: string
      required:
      - message
    Profile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - email
      - id
      - last_login
      - username
    ProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        message:
          type: string
          default: Profile retrieved successfully
        data:
          $ref: '#/components/schemas/Profile'
      required:
      - data
    SignupRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        password_confirmation:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
      - password_confirmation
      - username
    SignupResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        message:
          type: string
          default: Signup successful
        data:
          $ref: '#/components/schemas/UserSummary'
      required:
      - data
    SourceEnum:
      type: string
      enum:
      - image_upload
      - video_upload
    UserSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
      required:
      - email
      - id
      - username
    VideoDetectionData:
      type: object
      properties:
        upload_id:
          type: string
          format: uuid
        video:
          $ref: '#/components/schemas/VideoMetadata'
        sample_fps:
          type: number
          format: double
        frames_analyzed:
          type: integer
        alert:
          type: boolean
        summary:
          type: object
          additionalProperties:
            type: integer
          description: 'Nombre de détections par label, ex. {"no_helmet": 4}.'
        violations:
          type: array
          items:
            $ref: '#/components/schemas/VideoViolationFrame'
          description: Images analysées contenant au moins une infraction.
      required:
      - alert
      - frames_analyzed
      - sample_fps
      - summary
      - upload_id
      - video
      - violations
    VideoDetectionResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        message:
          type: string
          default: Video processed successfully
        data:
          $ref: '#/components/schemas/VideoDetectionData'
      required:
      - data
    VideoMetadata:
      type: object
      properties:
        duration:
          type: number
          format: double
          description: Secondes.
        fps:
          type: number
          format: double
        frame_count:
          type: integer
        width:
          type: integer
        height:
          type: integer
      required:
      - duration
      - fps
      - frame_count
      - height
      - width
    VideoUploadRequest:
      type: object
      properties:
        video:
          type: string
          format: binary
          description: Vidéo MP4, MOV, AVI ou WebM (50 Mio et 120 s max par défaut).
        sample_fps:
          type: number
          format: double
          maximum: 10
          minimum: 0.1
          description: 'Images analysées par seconde de vidéo (défaut : 1).'
      required:
      - video
    VideoViolationFrame:
      type: object
      properties:
        detections:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: Détections (format du schéma WsDetection).
        frame:
          type: integer
          description: Index de l'image dans la vidéo.
        timestamp:
          type: number
          format: double
          description: Position en secondes.
        image:
          type: string
          nullable: true
          description: Image annotée (JPEG base64) ; null au-delà de DETECTION_VIDEO_MAX_ANNOTATED_FRAMES
            images.
      required:
      - detections
      - frame
      - image
      - timestamp
    WsAlert:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/WsAlertTypeEnum'
        event:
          $ref: '#/components/schemas/EventEnum'
        message:
          type: string
          example: A violation has been detected
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          description: Absent pour une image envoyée sur le WebSocket.
        upload_id:
          type: string
          format: uuid
          description: Présent pour les uploads REST.
        data:
          type: object
          properties:
            detections:
              type: array
              items:
                $ref: '#/components/schemas/WsDetection'
            frame:
              type: integer
              description: 'Vidéo uniquement : index de l''image.'
            timestamp:
              type: number
              description: 'Vidéo uniquement : position en secondes.'
          required:
          - detections
      required:
      - type
      - event
      - message
      - data
    WsAlertTypeEnum:
      type: string
      enum:
      - alert
    WsBoundingBox:
      type: object
      properties:
        x1:
          type: number
          format: float
        y1:
          type: number
          format: float
        x2:
          type: number
          format: float
        y2:
          type: number
          format: float
      required:
      - x1
      - y1
      - x2
      - y2
    WsDetection:
      type: object
      properties:
        class_id:
          type: integer
          example: 0
        label:
          type: string
          example: no_helmet
        confidence:
          type: number
          format: float
          example: 0.87
        bbox:
          $ref: '#/components/schemas/WsBoundingBox'
      required:
      - class_id
      - label
      - confidence
      - bbox
    WsDetectionResult:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/WsDetectionResultTypeEnum'
        success:
          $ref: '#/components/schemas/WsDetectionResultSuccessEnum'
        data:
          type: object
          properties:
            image:
              type: string
              description: Image annotée, JPEG encodé en base64.
            detections:
              type: array
              items:
                $ref: '#/components/schemas/WsDetection'
            message:
              type: string
              example: Image processed successfully
          required:
          - image
          - detections
          - message
      required:
      - type
      - success
      - data
    WsDetectionResultSuccessEnum:
      type: boolean
      enum:
      - true
    WsDetectionResultTypeEnum:
      type: string
      enum:
      - detection_result
    WsError:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/WsErrorTypeEnum'
        success:
          $ref: '#/components/schemas/WsErrorSuccessEnum'
        code:
          $ref: '#/components/schemas/WsErrorCodeEnum'
        message:
          type: string
      required:
      - type
      - success
      - code
      - message
    WsErrorCodeEnum:
      type: string
      enum:
      - invalid_image
      - busy
      - processing_error
    WsErrorSuccessEnum:
      type: boolean
      enum:
      - false
    WsErrorTypeEnum:
      type: string
      enum:
      - error
    WsImageMessage:
      type: object
      description: 'Message client → serveur (alternative : trame binaire JPEG/PNG).'
      properties:
        type:
          $ref: '#/components/schemas/WsImageMessageTypeEnum'
        image:
          type: string
          description: Image JPEG/PNG en base64, ou data URL `data:image/jpeg;base64,...`.
      required:
      - type
      - image
    WsImageMessageTypeEnum:
      type: string
      enum:
      - image
    WsVideoCompleted:
      type: object
      description: Fin d'analyse d'une vidéo envoyée via POST /api/detection/video/.
      properties:
        type:
          $ref: '#/components/schemas/WsVideoCompletedTypeEnum'
        upload_id:
          type: string
          format: uuid
        data:
          type: object
          properties:
            video:
              $ref: '#/components/schemas/VideoMetadata'
            frames_analyzed:
              type: integer
            alert:
              type: boolean
            summary:
              type: object
              additionalProperties:
                type: integer
      required:
      - type
      - upload_id
      - data
    WsVideoCompletedTypeEnum:
      type: string
      enum:
      - video_completed
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT obtenu via POST /api/auth/login/ (champ data.access). Sans
        expiration, révoqué par /api/auth/logout/.
tags:
- name: Authentification
  description: Comptes et JWT.
- name: Détection
  description: Upload de photos et vidéos analysées par YOLOv8. Le flux temps réel
    passe par le WebSocket /ws/detection/ décrit en haut de page.
- name: Système
  description: Supervision du service.
